services:
  - type: web
    name: campus-cash-backend
    env: node
    buildCommand: npm install --ignore-scripts
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://campuscash.vercel.app
